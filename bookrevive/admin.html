<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · BookRevive</title><link rel="icon" href="assets/logo.png"><link rel="stylesheet" href="css/style.css"></head><body><main class="wrap sec" style="padding-top:30px"><h2>Admin dashboard</h2><p class="sub">Manage inventory, discounts, orders and members.</p><div class="stats" id="st"></div>
<h3>Add a book</h3><form class="af" id="add" style="margin-top:12px"><input name="title" placeholder="Title" required><input name="author" placeholder="Author" required><select name="cat" id="cat"></select><input name="price" type="number" step="0.01" min="0" placeholder="Price $" required><input name="off" type="number" min="0" max="90" placeholder="Discount %"><input name="stock" type="number" min="0" placeholder="Stock" required><button class="btn">Add</button></form>
<h3>Inventory</h3><div class="tw" style="margin-top:12px"><table><thead><tr><th>Title</th><th>Category</th><th>Price</th><th>Discount</th><th>Stock</th><th></th></tr></thead><tbody id="inv"></tbody></table></div>
<h3>Orders</h3><div class="tw" style="margin-top:12px"><table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Method</th><th>Date</th></tr></thead><tbody id="ord"></tbody></table></div>
<h3>Members</h3><div class="tw" style="margin-top:12px"><table><thead><tr><th>Name</th><th>Email</th><th>Points</th><th>Joined</th></tr></thead><tbody id="mem"></tbody></table></div></main>
<script src="js/app.js"></script><script>(async()=>{await seedAdmin();layout();admin()})()</script></body></html>
